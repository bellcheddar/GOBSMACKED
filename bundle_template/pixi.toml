# The run bundle's environment. Nothing here is installed on the GOBSMACKED
# server: the server is a 3.8 GB CPU droplet and this stack is torch, CUDA and
# AmberTools. That separation is the whole point of the two-stage design.
#
#   pixi install
#   pixi run gobsmacked
#
# python 3.11: openff-toolkit and openmmforcefields both lag the current Python
# release on conda-forge, and 3.11 is the newest with builds across linux-64 and
# osx-arm64. Check `pixi search openff-toolkit` before raising it.

[workspace]
name = "gobsmacked-run"
version = "1.0.0"
description = "Fold, dock, relax and summarise one protein-ligand complex"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[dependencies]
python = "3.11.*"

# --- Structure preparation and chemistry ---
rdkit = ">=2024.03"
pdbfixer = "*"
gemmi = ">=0.6.5"

# --- MD ---
openmm = ">=8.2"
# Provides the OpenFF template generator used for the ligand. Pulls AmberTools,
# which is about a gigabyte, and is what AM1-BCC charging actually needs; there
# is no lighter route to correct ligand charges.
openmmforcefields = "*"
openff-toolkit = "*"
mdtraj = "*"

# --- Shared ---
numpy = "*"
scipy = "*"
pyyaml = "*"
pip = "*"

[pypi-dependencies]
# Docking. The default install is the empirical search alone, which is about
# 200 MB. The SE(3) GNN rescoring model wants PyTorch and PyTorch Geometric,
# roughly three gigabytes more, so it is an opt-in environment rather than a
# tax on every run: `run.py` already falls back from hybrid to dock when the
# checkpoint is unavailable, and says so in the warnings.
pandadock = ">=4.1"

# Folding, needed only when the bundle carries no model_apo.pdb. Most bundles
# do carry one, because the server found an AlphaFold or PDB structure first.
[feature.fold.pypi-dependencies]
fair-esm = ">=2.0"

[environments]
# pixi run gobsmacked           dock and MD, the smallest install
# pixi run -e fold gobsmacked   adds ESMFold, for a bundle with no model
#
# No solve-group, deliberately. Sharing one makes pixi resolve every
# environment against a single locked set, so the default environment inherits
# whatever the others need.
#
# There is no `gnn` environment here even though `docking.mode: hybrid` uses
# one, and that is a deliberate omission rather than an oversight. PandaDock's
# [gnn] extra pins torch-scatter, which publishes no wheel for macOS arm64 on
# Python 3.11 and needs torch importable while its own metadata is being built.
# pixi solves EVERY declared environment before it writes the lock file, so
# declaring one that cannot be solved here means no lock file at all and no
# environment of any kind: the failure is total, not partial. Add it yourself on
# a machine where it resolves:
#
#   pixi add --pypi torch torch-geometric
#   pixi add --pypi "pandadock[gnn]"
#
# Without it, `run.py` falls back from hybrid to the empirical scorer and says
# so in the archive's warnings, which is a working run rather than a failed one.
default = { features = [] }
fold = { features = ["fold"] }

[tasks]
gobsmacked = "python run.py"
plan = "python run.py --list"

[activation.env]
# conda-forge's scientific stack and any pip-installed package bundling its own
# libomp will both initialise OpenMP in one process, which aborts with
# "OMP: Error #15 ... already initialized" on macOS.
KMP_DUPLICATE_LIB_OK = "TRUE"

[target.linux-64.dependencies]
# CUDA-enabled builds on Linux. On macOS OpenMM's OpenCL platform is used
# instead, and torch falls back to MPS or CPU.
cuda-version = ">=12.0"
