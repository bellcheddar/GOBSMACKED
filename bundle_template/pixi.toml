# The run bundle's environment. Nothing here is installed on the GOBSMACKED
# server: the server is a 3.8 GB CPU droplet and this stack is torch, CUDA and
# AmberTools. That separation is the whole point of the two-stage design.
#
#   pixi install
#   pixi run gobsmacked
#
# python 3.11: openff-toolkit and openmmforcefields both lag the current Python
# release on conda-forge, and 3.11 is the newest with builds across linux-64 and
# osx-arm64. Check `pixi search openff-toolkit` before raising it.

[workspace]
name = "gobsmacked-run"
version = "1.0.0"
description = "Fold, dock, relax and summarise one protein-ligand complex"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[dependencies]
python = "3.11.*"

# --- Structure preparation and chemistry ---
rdkit = ">=2024.03"
pdbfixer = "*"
gemmi = ">=0.6.5"

# --- MD ---
openmm = ">=8.2"
# Provides the OpenFF template generator used for the ligand. Pulls AmberTools,
# which is about a gigabyte, and is what AM1-BCC charging actually needs; there
# is no lighter route to correct ligand charges.
openmmforcefields = "*"
openff-toolkit = "*"
mdtraj = "*"

# --- Shared ---
numpy = "*"
scipy = "*"
pyyaml = "*"
pip = "*"

[pypi-dependencies]
pandadock = ">=4.1"
# PandaDock's GNN rescorer, which `docking.mode: hybrid` needs and which the
# campaign asks for by default. This was left out on the belief that it meant
# three gigabytes and a torch-scatter build with no macOS arm64 wheel. Neither
# holds: pandadock already pulls torch itself, so torch is in this environment
# either way, and pandadock imports only torch_geometric, which is a pure
# Python wheel that installs on both platforms with nothing to compile.
# torch-scatter is a dependency of PandaDock's own [gnn] extra, not of the code
# path the rescorer actually takes.
#
# Verified by running `pandadock hybrid` to completion with the checkpoint on
# osx-arm64: GNN pEC50 and GNN energy for every pose, on MPS.
torch-geometric = ">=2.4"

# Folding, needed only when the bundle carries no model_apo.pdb. Most bundles
# do carry one, because the server found an AlphaFold or PDB structure first.
[feature.fold.pypi-dependencies]
fair-esm = ">=2.0"

# --- Stage 5, affinity ------------------------------------------------------
# Boltz-2's affinity head, scored on a pose this pipeline already has, with the
# structure module bypassed: the Boltzina pattern. It is a standalone
# environment and the stage shells into it, never imports it, for the same
# reason PLIP is a subprocess: the dependency sets cannot share a solve. Boltz
# pins numpy<2.0 and gemmi 0.6.5; OpenMM, openff-toolkit and openmmforcefields
# in the default environment want numpy 2 and a current gemmi. Merged, they do
# not produce a slow environment, they produce no lock file at all.
#
# Every pin below matches boltz's own pip metadata. Leaving one open lets
# conda-forge pick a newer build and the solve fails as an unsatisfiable
# conda/PyPI conflict, because both land in one environment. The three
# sdist-only packages are declared explicitly because pip resolution alone
# leaves them out of a packed environment, and all three are unconditional
# imports of boltz.main: without them the CLI crashes on every invocation.
# All of this is BoltzMaker's, learned there and not re-learned here.
#
# fairscale, which boltz also pins and which is also sdist-only, is deliberately
# absent: conda-forge's build requires conda's own pytorch>=2.1,<2.2, which
# conflicts with the pip torch boltz installs, and two torches in one
# environment is worse than a slow first install.
[feature.affinity.dependencies]
python = "3.11.*"
pip = "*"
gemmi = "0.6.5.*"
biopython = "1.84.*"
scipy = "1.13.*"
requests = "2.32.3.*"
pyyaml = "6.0.2.*"
ihm = "2.11.*"
modelcif = "1.2.*"
antlr4-python3-runtime = "4.9.3.*"
rdkit = "*"

[feature.affinity.pypi-dependencies]
boltz = ">=2.2"

[environments]
# pixi run gobsmacked           dock and MD, the smallest install
# pixi run -e fold gobsmacked   adds ESMFold, for a bundle with no model
#
# No solve-group, deliberately. Sharing one makes pixi resolve every
# environment against a single locked set, so the default environment inherits
# whatever the others need.
#
# There is still no `gnn` environment, and now there is no need for one: the
# rescorer's real requirement, torch_geometric, is in the default environment
# above. What must NOT go in is `pandadock[gnn]`, whose extra pins torch-scatter:
# that publishes no wheel for macOS arm64 on Python 3.11 and needs torch
# importable while its own metadata is being built. pixi solves EVERY declared
# environment before it writes the lock file, so declaring one that cannot be
# solved means no lock file at all and no environment of any kind. The failure
# is total, not partial.
#
# `run.py` still falls back from hybrid to the empirical scorer when the
# checkpoint cannot be fetched, and says so in the archive's warnings, which is
# a working run rather than a failed one.
default = { features = [] }
fold = { features = ["fold"] }
# no-default-feature is load-bearing, not tidiness: without it this environment
# inherits [dependencies] -- OpenMM, openff-toolkit, numpy 2 -- and cannot solve.
affinity = { features = ["affinity"], no-default-feature = true }

[tasks]
gobsmacked = "python run.py"
plan = "python run.py --list"

[activation.env]
# conda-forge's scientific stack and any pip-installed package bundling its own
# libomp will both initialise OpenMP in one process, which aborts with
# "OMP: Error #15 ... already initialized" on macOS.
KMP_DUPLICATE_LIB_OK = "TRUE"

[target.linux-64.dependencies]
# CUDA-enabled builds on Linux. On macOS OpenMM's OpenCL platform is used
# instead, and torch falls back to MPS or CPU.
cuda-version = ">=12.0"
