# nginx site for GOBSMACKED. provision.sh substitutes __SERVER_NAME__ and
# __BIND_ADDR__ and installs this to /etc/nginx/sites-available/gobsmacked;
# certbot --nginx then adds the TLS directives.
server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    # Mol* is 5 MB and Plotly 4.6 MB, so nginx serves them, not gunicorn. Every
    # reference carries a ?v=<mtime> stamp, which is what makes `immutable` safe
    # here: a changed file has a changed URL.
    location /static/ {
        alias /opt/gobsmacked/app/static/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # no access_log directive here on purpose: nginx.conf sets the droplet-wide
        # `vhost` log format, which appends the requested host, and the launcher's
        # per-app hit counter skips any line without it. Naming `combined` here, or
        # turning the log off, silently zeroes this app's visit count.
    }

    location / {
        proxy_pass http://__BIND_ADDR__;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The analysis runs inside the upload request: 20 to 40 s for a small
        # archive, and a long trajectory is slower. The default 60 s would cut
        # a working analysis off at the knees and report a gateway error.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # A results archive with a full trajectory. The app refuses anything larger
    # itself (MAX_UPLOAD_BYTES), but nginx has to let it reach the app to say so.
    client_max_body_size 512m;
    client_body_timeout 300s;
}
